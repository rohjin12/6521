<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>청렴 신고 사건 조회</title>
<style>
:root{--bg:#f4f1ea;--ink:#1d2a2e;--mut:#5f6b6e;--card:#fffdf8;--line:#ddd6c6;--accent:#0f5c63;--done:#2f7d4f;--ing:#b7791f;--tr:#5b5fc7;--rej:#8a8f93;--new:#0f5c63}
@media(prefers-color-scheme:dark){:root{--bg:#141a1c;--ink:#e8eeee;--mut:#9aa8aa;--card:#1c2528;--line:#2e3b3e;--accent:#5fc1c9}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;line-height:1.5}
.wrap{max-width:1040px;margin:0 auto;padding:28px 18px 60px}
h1{font-size:1.7rem;margin:0 0 4px;letter-spacing:-.02em}
.sub{color:var(--mut);margin:0 0 22px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.filters{display:flex;flex-wrap:wrap;gap:12px;align-items:end}
label{display:flex;flex-direction:column;font-size:.8rem;color:var(--mut);gap:4px}
select,input{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);min-width:150px}
button{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid var(--accent);background:transparent;color:var(--accent);cursor:pointer}
button:hover{background:var(--accent);color:#fff}
#count{font-size:1.1rem;font-weight:700;margin:6px 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--rej);border-radius:10px;padding:12px 14px}
.card dl{margin:0;display:grid;grid-template-columns:64px 1fr;row-gap:3px;font-size:.92rem}
.card dt{color:var(--mut)}.card dd{margin:0}
.card .cid{font-size:.75rem;color:var(--mut);margin-bottom:6px}
.badge{display:inline-block;padding:1px 9px;border-radius:99px;color:#fff;font-size:.82rem}
.s-처리완료{border-left-color:var(--done)}.s-처리완료 .badge{background:var(--done)}
.s-조사중{border-left-color:var(--ing)}.s-조사중 .badge{background:var(--ing)}
.s-이첩{border-left-color:var(--tr)}.s-이첩 .badge{background:var(--tr)}
.s-접수완료{border-left-color:var(--new)}.s-접수완료 .badge{background:var(--new)}
.s-기각 .badge{background:var(--rej)}
#more{display:block;margin:18px auto 0}
.empty{padding:30px;text-align:center;color:var(--mut)}
h2{font-size:1.05rem;margin:0 0 10px}
#rss ul{list-style:none;margin:0;padding:0}
#rss li{padding:8px 0;border-bottom:1px solid var(--line)}
#rss li:last-child{border:0}
#rss a{color:var(--accent);text-decoration:none;font-weight:600}
#rss a:hover{text-decoration:underline}
#rss time{display:block;font-size:.78rem;color:var(--mut)}
.note{font-size:.8rem;color:var(--mut)}
</style>
</head>
<body>
<div class="wrap">
  <h1>청렴 신고 사건 조회</h1>
  <p class="sub">신고유형·처리상태로 청렴 신고 사건을 빠르게 찾아보세요. (총 <span id="total"></span>건 수록)</p>

  <div class="panel">
    <div class="filters">
      <label>신고유형<select id="fType"><option value="">전체</option></select></label>
      <label>처리상태<select id="fStatus"><option value="">전체</option></select></label>
      <label>지역<select id="fRegion"><option value="">전체</option></select></label>
      <button id="reset" type="button">초기화</button>
    </div>
  </div>

  <div id="count" aria-live="polite">결과 0건</div>
  <div id="list" class="grid"></div>
  <button id="more" type="button" hidden>더 보기</button>

  <div class="panel" id="rss" style="margin-top:28px">
    <h2>행정안전부 최신 보도자료 <span class="note">(korea.kr RSS)</span></h2>
    <div id="rssBody" class="note">불러오는 중…</div>
  </div>
</div>

<script>
const RSS_URL = "https://www.korea.kr/rss/dept_mois.xml";
const DATA = JSON.parse(document.getElementById("data").textContent);
const $ = id => document.getElementById(id);
const PAGE = 60; let shown = PAGE, filtered = DATA;
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function fill(sel, key){
  [...new Set(DATA.map(d => d[key]))].sort((a,b)=>a.localeCompare(b,"ko"))
    .forEach(v => sel.insertAdjacentHTML("beforeend", `<option>${esc(v)}</option>`));
}
fill($("fType"),"type"); fill($("fStatus"),"status"); fill($("fRegion"),"region");
$("total").textContent = DATA.length;

function render(){
  $("count").textContent = `결과 ${filtered.length}건`;
  const rows = filtered.slice(0, shown);
  $("list").innerHTML = rows.length ? rows.map(d => `
    <article class="card s-${esc(d.status)}">
      <div class="cid">${esc(d.id)}</div>
      <dl><dt>신고일자</dt><dd>${esc(d.date)}</dd>
      <dt>신고유형</dt><dd>${esc(d.type)}</dd>
      <dt>지역</dt><dd>${esc(d.region)}</dd>
      <dt>처리상태</dt><dd><span class="badge">${esc(d.status)}</span></dd></dl>
    </article>`).join("") : `<div class="empty" style="grid-column:1/-1">조건에 맞는 사건이 없습니다.</div>`;
  $("more").hidden = shown >= filtered.length;
}
function apply(){
  const t=$("fType").value, s=$("fStatus").value, r=$("fRegion").value;
  filtered = DATA.filter(d => (!t||d.type===t) && (!s||d.status===s) && (!r||d.region===r))
                 .sort((a,b)=> b.date.localeCompare(a.date));
  shown = PAGE; render();
}
["fType","fStatus","fRegion"].forEach(id => $(id).addEventListener("change", apply));
$("reset").onclick = () => { ["fType","fStatus","fRegion"].forEach(id => $(id).value=""); apply(); };
$("more").onclick = () => { shown += PAGE; render(); };
apply();

/* ---- korea.kr RSS 임베드: 직접 요청 → CORS 프록시 순서로 시도 ---- */
function parseRSS(xmlText){
  const doc = new DOMParser().parseFromString(xmlText, "text/xml");
  return [...doc.querySelectorAll("item")].slice(0,10).map(i => ({
    title: i.querySelector("title")?.textContent.trim() || "",
    link: i.querySelector("link")?.textContent.trim() || "#",
    date: i.querySelector("pubDate")?.textContent.trim() || ""
  })).filter(x => x.title);
}
async function getText(url){
  const r = await fetch(url, {cache:"no-store"}); if(!r.ok) throw new Error(r.status); return r.text();
}
async function loadRSS(){
  const tries = [
    () => getText(RSS_URL),
    () => getText("https://api.allorigins.win/raw?url=" + encodeURIComponent(RSS_URL)),
    () => getText("https://corsproxy.io/?" + encodeURIComponent(RSS_URL))
  ];
  for (const t of tries){
    try { const items = parseRSS(await t()); if (items.length >= 5) return items; } catch(e){}
  }
  return null;
}
loadRSS().then(items => {
  const body = $("rssBody");
  if(!items){
    body.innerHTML = `보도자료를 불러오지 못했습니다. <a href="${RSS_URL}" target="_blank" rel="noopener">RSS 원문 바로가기</a>`;
    return;
  }
  body.className = "";
  body.innerHTML = "<ul>" + items.map(x => {
    const d = x.date ? new Date(x.date) : null;
    const ds = d && !isNaN(d) ? d.toLocaleDateString("ko-KR") : esc(x.date);
    return `<li><a href="${esc(x.link)}" target="_blank" rel="noopener">${esc(x.title)}</a><time>${ds}</time></li>`;
  }).join("") + "</ul>";
});
</script>
